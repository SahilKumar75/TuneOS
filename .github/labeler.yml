frontend:
  - changed-files:
      - any-glob-to-any-file:
          - "app/components/**"
          - "app/pages/**"
          - "app/styles.py"
          - "**/*.css"
          - "assets/**"

backend:
  - changed-files:
      - any-glob-to-any-file:
          - "app/api/**"
          - "app/state/**"
          - "trainer/**"
          - "workers/**"
          - "main.py"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "Dockerfile"
          - "docker-compose*"
          - ".github/**"
          - "hf_spaces/**"
          - "*.sh"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "poetry.lock"
          - "pyproject.toml"
