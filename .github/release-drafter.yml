name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "New Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "Bug Fixes"
    labels:
      - "bug"
      - "fix"
  - title: "Backend"
    labels:
      - "backend"
  - title: "Frontend"
    labels:
      - "frontend"
  - title: "Infrastructure"
    labels:
      - "infra"
  - title: "Documentation"
    labels:
      - "docs"
      - "documentation"
  - title: "Dependencies"
    labels:
      - "dependencies"

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "feature"
      - "enhancement"
  patch:
    labels:
      - "bug"
      - "fix"
      - "docs"
      - "dependencies"
      - "infra"
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
