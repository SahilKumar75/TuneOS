name: Auto-assign Reviewer

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign-reviewer:
    name: Request review from code owner
    runs-on: ubuntu-latest
    # Skip draft PRs and bot-authored PRs
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Request review from the code owner (skip if author is the owner)
            const reviewers = ['SahilKumar75'].filter(r => r !== author);

            if (reviewers.length > 0) {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                reviewers,
              });
              console.log(`Requested review from: ${reviewers.join(', ')}`);
            } else {
              console.log('PR author is the sole code owner — skipping auto-assign.');
            }
