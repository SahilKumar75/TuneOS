name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  POETRY_VERSION: "1.8.2"

jobs:
  # ── Path detection ────────────────────────────────────────────────
  # One filter pass drives which dedicated jobs run. Keeping every job in
  # a single workflow lets the `ci-gate` aggregator below observe each
  # job's result (success/skipped/failure) via `needs`, which is what makes
  # a single required status check correct under branch protection.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.filter.outputs.lint }}
      core: ${{ steps.filter.outputs.core }}
      ui: ${{ steps.filter.outputs.ui }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            lint:
              - '**/*.py'
            core:
              - 'trainer/**'
              - 'workers/**'
              - 'app/api/**'
              - 'app/state/**'
              - 'main.py'
              - 'tests/**'
              - 'conftest.py'
              - 'pyproject.toml'
              - 'poetry.lock'
            ui:
              - 'app/components/**'
              - 'app/pages/**'
              - 'app/app.py'
              - 'app/styles.py'
            docker:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'hf_spaces/**'
            docs:
              - '**/*.md'
              - 'docs/**'

  # ── Lint (ruff + mypy) ────────────────────────────────────────────
  # Any .py change. Installs only the dev group — no torch/transformers.
  lint:
    name: Lint and format
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: lint-venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            lint-venv-${{ runner.os }}-py3.12-

      - name: Install lint dependencies
        run: poetry install --no-interaction --no-root --only dev

      - name: Ruff lint
        run: poetry run ruff check --output-format=github .

      - name: Ruff format check
        run: poetry run ruff format --check .

      - name: Mypy type check
        run: poetry run mypy

  # ── Core tests ────────────────────────────────────────────────────
  # The real logic lives in trainer/, workers/, app/api/, app/state/.
  # Full 3.10 + 3.12 matrix. Runs the whole suite in default (alphabetical)
  # order so the sys.modules-mock ordering invariant between
  # test_workers.py and test_config_repro.py holds.
  test-core:
    name: Test core (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: test-venv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            test-venv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: poetry install --no-interaction --no-root --with dev

      - name: Run tests
        run: poetry run pytest --ignore=tests/test_pyqt.py

  # ── UI sanity check ───────────────────────────────────────────────
  # Reflex component/page changes. Lighter: single Python, dev-only deps,
  # ruff + import-compile the touched UI tree. No heavy ML install.
  test-ui:
    name: UI check
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@v4
        with:
          path: .venv
          key: ui-venv-${{ runner.os }}-py3.12-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ui-venv-${{ runner.os }}-py3.12-

      - name: Install lint dependencies
        run: poetry install --no-interaction --no-root --only dev

      - name: Ruff check UI tree
        run: poetry run ruff check --output-format=github app/components app/pages

  # ── Docker image build ────────────────────────────────────────────
  docker:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The ML stack (torch, transformers, bitsandbytes, …) is large.
      # Reclaim ~25 GB by removing tools the Docker build doesn't need.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: tuneos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Docs lint ─────────────────────────────────────────────────────
  # Markdown only. No Python install — fast.
  docs:
    name: Docs lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !.web/**
            !node_modules/**

  # ── Aggregator gate ───────────────────────────────────────────────
  # This is the ONLY job that branch protection should require. It runs
  # always (even when upstream jobs are skipped) and fails if any required
  # job actually failed or was cancelled. Skipped path-gated jobs are
  # treated as a pass, so a docs-only PR is not blocked on test-core, etc.
  ci-gate:
    name: CI
    needs: [changes, lint, test-core, test-ui, docker, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream results
        run: |
          echo "changes:   ${{ needs.changes.result }}"
          echo "lint:      ${{ needs.lint.result }}"
          echo "test-core: ${{ needs.test-core.result }}"
          echo "test-ui:   ${{ needs.test-ui.result }}"
          echo "docker:    ${{ needs.docker.result }}"
          echo "docs:      ${{ needs.docs.result }}"
          # A job result is one of: success, skipped, failure, cancelled.
          # Pass only if no upstream job failed or was cancelled.
          for r in \
            "${{ needs.changes.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.test-core.result }}" \
            "${{ needs.test-ui.result }}" \
            "${{ needs.docker.result }}" \
            "${{ needs.docs.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job did not pass (result=$r)."
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped."
