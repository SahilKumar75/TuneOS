name: Stale issues and PRs

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 30 days and is now marked stale.
            Comment or update to keep it open; otherwise it will be closed in 7 days.
          stale-pr-message: >
            This PR has been inactive for 30 days and is now marked stale.
            Push a commit or comment to keep it open; otherwise it will be closed in 7 days.
          close-issue-message: "Closed as stale after 7 days of inactivity. Reopen anytime."
          close-pr-message: "Closed as stale after 7 days of inactivity. Reopen anytime."
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security,in-progress"
          exempt-pr-labels: "pinned,security,in-progress"
          operations-per-run: 100
