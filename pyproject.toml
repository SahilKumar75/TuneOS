[tool.poetry]
name = "tuneos"
version = "0.1.0"
description = "TuneOS"
authors = ["Shekhar <shekhar59324@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
torch = ">=2.1.0"
transformers = ">=4.40.0"
peft = ">=0.10.0"
bitsandbytes = ">=0.43.0"
datasets = ">=2.18.0"
accelerate = ">=0.28.0"
trl = ">=0.8.0"
reflex = ">=0.5.0"
celery = {extras = ["redis"], version = ">=5.3.0"}
redis = ">=5.0.0"
huggingface-hub = ">=0.22.0"
python-dotenv = ">=1.0.0"
evaluate = ">=0.4.0"
nltk = ">=3.8.0"
pandas = ">=2.0.0"

[tool.poetry.group.desktop.dependencies]
PyQt6 = ">=6.6.0"
PyQt6-WebEngine = ">=6.6.0"
httpx = ">=0.27.0"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
pyinstaller = "^6.20.0"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.0"
pytest = ">=8.0.0"
mypy = ">=1.10.0"

[tool.poetry.scripts]
tuneos = "main:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".web", ".states", "build", "dist", "hf_deploy", "reflex.lock"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test modules deliberately stub heavy dependencies in sys.modules before
# importing the modules under test, so imports are not at the top of the file.
"tests/**" = ["E402"]

[tool.mypy]
# Scoped to pure-logic, framework-light modules where static typing is
# meaningful. Excluded: the Reflex UI layer (dynamic Var typing) and the thin
# wrappers around torch/trl/peft, whose third-party stubs are incomplete and
# produce false positives that aren't real bugs.
files = ["trainer/config.py", "trainer/metrics.py", "trainer/evaluate.py", "app/state/experiments_db.py"]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The PyQt smoke test requires a display server; it is exercised in the
# desktop packaging job, not the headless unit-test run.
norecursedirs = [".web", ".states", "build", "dist"]
