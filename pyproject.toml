[tool.poetry]
name = "tuneos"
version = "0.1.0"
description = "TuneOS"
authors = ["Author <author@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
torch = ">=2.1.0"
transformers = ">=4.40.0"
peft = ">=0.10.0"
bitsandbytes = ">=0.43.0"
datasets = ">=2.18.0"
accelerate = ">=0.28.0"
trl = ">=0.8.0"
reflex = ">=0.5.0"
celery = {extras = ["redis"], version = ">=5.3.0"}
redis = ">=5.0.0"
huggingface-hub = ">=0.22.0"
python-dotenv = ">=1.0.0"
evaluate = ">=0.4.0"
nltk = ">=3.8.0"
pandas = ">=2.0.0"

[tool.poetry.group.desktop.dependencies]
PyQt6 = ">=6.6.0"
PyQt6-WebEngine = ">=6.6.0"
httpx = ">=0.27.0"
fastapi = "^0.136.3"
uvicorn = "^0.48.0"
pyinstaller = "^6.20.0"

[tool.poetry.scripts]
tuneos = "main:main"
